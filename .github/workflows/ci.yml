name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the simulation logic
        run: node --test test/js/*.test.mjs
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/star-invaders .
